  <!-- SECCIÓN CONTACTO-->
  <!--Filtro tipo svg para contorno de los iconos-->
  <svg width="0" height="0" style="position:absolute">
  <filter id="contorno-sticker">

    <!--contorno exterior-->
    <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="exterior-engordado"/>
    <feFlood flood-color="#f0ede5" result="color-exterior"/>
    <feComposite in="color-exterior" in2="exterior-engordado" operator="in" result="borde-exterior"/>

  <!--contorno interior-->
    <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="interior-engordado"/>
    <feFlood flood-color="#9B5DE5" result="color-interior"/>
    <!--recorta para que solo se vea la silueta engordada-->
    <feComposite in="color-interior" in2="interior-engordado" operator="in" result="borde-interior"/>
    <!--orden de iconos tipo sticker-->
    <feMerge>
      <feMergeNode in="borde-exterior"/>
      <feMergeNode in="borde-interior"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</svg>
